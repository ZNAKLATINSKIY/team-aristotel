<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container">
  <div class="box">
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Blanditiis culpa cum cumque delectus distinctio dolor eaque eveniet exercitationem fugiat impedit, itaque maiores nemo, odio officia, quia rem repudiandae sunt voluptatibus?</p>
  </div>
</div>
<script>

  function getRandomColor() {
    return `rgb(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)})`;
  }

  // document.body.style.userSelect = 'none';

  let box = document.querySelector('.box');
  box.style.transition = '0.5s';
  box.addEventListener("selectstart", function (e) {
    e.preventDefault();
    this.style.color = getRandomColor();
  });
  box.addEventListener("contextmenu", function (e) {
  });
</script>
</body>
</html>
