<body>

        document.querySelector("body").innerHTML = "<div class='container'></div>";

        document.querySelector(".info__content-header").insertAdjacentHTML("beforeend", "<div class='info__name'>АРЛАН ГАБДЫЛХАК</div>");

        let body = document.body;
        let container = document.querySelector(".container");
        let info = document.querySelector(".info");
        let card = document.querySelector(".card");
        let gifOne = document.querySelector(".info__gif-1");
        let gifTwo = document.querySelector(".info__gif-2");
        let portrait = document.querySelector(".info__portrait");
        let content = document.querySelector(".info__content");

        let imageTwo = document.querySelector(".info__portrait-1");

        body.style.backgroundColor = "#000";

        body.style.pading = " 0 auto";
        body.style.overflow = " hidden";

        body.style.backgroundSize = "cover";

        container.style.maxWidth = " 1060px";
        container.style.maxWidth = " 1060px";
        container.style.margin = " 0 auto";

        info.style.display = "flex";

        info.style.alignItems = "center";
        info.style.minHeight = "100vh"
        info.style.maxWidthheight = "100%"

        gifOne.style.position = "absolute";

        gifOne.style.top = "80px";

        //SECOND CITY
        gifTwo.style.position = "absolute";

        content.style.display = "flex";
        content.style.justifyContent = "center";
        content.style.alignItems = "center";

        content.style.padding = "10px"

        name.style.color = "#fff";

        details.style.color = "#fff";

        details.style.fontSize = "30px";

        imageOne.style.width = "100px"
        imageOne.style.height = "100px"
        // FACE FORWARD
        imageTwo.style.width = "100px"
        imageTwo.style.padding = "0 20px 0 0"
        imageTwo.style.height = "100px"
