<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <div class="container">
        <div class="block-navigation">
            <div class="block-nav-box-">Home</div>
            <div class="block-nav-box-" id="block-nav-id">Categories</div>
            <div class="block-nav-up" id="block-up-id">
                <div class="block-up-blocks">Dress</div>
                <div class="block-up-blocks">Dress</div>
                <div class="block-up-blocks">Shirt</div>
                <div class="block-up-blocks">Jeans</div>
                <div class="block-up-blocks">Shoes</div>
            </div>
            <div class="block-nav-box-">About</div>
            <div class="block-nav-box-">Contact</div>
        </div>
      </div>
    </nav>
  </header>
</body>
<script>
    const blockNav = document.querySelector(".block-nav-up");


    document.getElementById("block-nav-id").onclick = function () {
        blockNav.style.transition = 'transform 0.5s ease';
        blockNav.style.transform = 'translateY(125px)';
        blockNav.style.transform = 'translateX(100px)';
    }
    document.addEventListener('click', function (event) {
        const isClickInsideModal = blockNav.contains(event.target);
        const isClickOnOpenButton = event.target.closest("#block-nav-id");

        if (!isClickOnOpenButton && !isClickInsideModal) {
            blockNav.style.transform = 'translate(100px, -500px)';
        }
    });
</script>
</html>
