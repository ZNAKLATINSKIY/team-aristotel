    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>

    <script>









        // 1. Написать функцию, которая принимает 2 числа и возвращает -1, 
        // если первое меньше, чем второе; 1 – если первое больше, ч
        // ем второе; и 0 – если числа равны.
        function one (test, numOne = prompt('Введите первое число: '), numTwo =  prompt('Введите второе число: ')) {
            if (numOne < numTwo) {
                alert('-1')
            } else if (numOne > numTwo) {
                alert('1')
            }
    }   
        // 2. Написать функцию, которая вычисляет факториал переданного ей числа.
        function two (test, number = prompt('Введите число: ')) {
            let i = 1;
            let d = 2;
            while (d <= number) {
                i = d * i;
                d++
            }
            return alert(i)
        }

        // 3. Написать функцию, которая принимает три отдельные цифры и превращает их в одно число. 
        // Например: цифры 1, 4, 9 превратятся в число 149.

        function three (test, numOne = prompt('Введите число: '), numTwo = prompt('Введите число: '), numThree = prompt('Введите число: ')) {
            result = numOne + numTwo + numThree;
            alert(result)
        }

        // 4. Написать функцию, которая принимает длину и ширину прямоугольника и вычисляет его площадь. 
        // Если в функцию передали 1 параметр, то она вычисляет площадь квадрата.
        function four(
                test,
				length = +prompt('Введите длину прямоугольника: '),
				width = +prompt('Введите ширину прямоугольника: ')
			) {
				if (length > 0 && width > 0) {
					alert('Площадь прямоугольника равняется: ' + length * width)
				} else if (length > 0 || width > 0) {
					let max = Math.max(length, width)
					alert('Некорректный ввод данных, площадь квадрата: ' + max * max)
				}
			}

            // 5. Написать функцию, которая проверяет, является ли переданное ей число совершенным. 
            // Совершенное число – это число, равное сумме всех своих собственных делителей.
            function six(test, number = +prompt('Введите совершенное число: ')) {
				let oneSty = number / 2

				let result = 0

				for (i = 1; i <= oneSty; i++) {
					if (number % i === 0) {
						result += i
					}
				}
				if (number == result) {
					alert('Вы ввели совершенное число!')
				} else {
					alert('Вы не ввели совершенное число...')
				}
			}

            // 6. Написать функцию, которая принимает минимальное и максимальное значения для диапазона,
            // и выводит только те числа из диапазона, которые являются совершенными.
            // Используйте написанную ранее функцию, чтобы узнавать, совершенное число или нет.
            function five (
                test,
				numOne = +prompt('Введите минимальное число диапазона: '),
				numTwo = +prompt('Введите максимальное число диапазона: ')
			) {
				for (i = numOne; i <= numTwo; i++) {
					let number = i
					let oneSty = number / 2

					let result = 0

					for (j = 1; j <= oneSty; j++) {
						if (number % j === 0) {
							result += j
						}
					}
					if (number === result) {
						alert('Вы ввели совершенное число: ' + i)
					}
				}
			}

            // 7. Написать функцию, которая принимает время (часы, минуты, секунды) 
            // и выводит его на экран в формате «чч:мм:сс». 
            // Если при вызове функции минуты и/или секунды не были переданы, 
            // то выводить их как 00.
            function seven(
                test,
				second = +prompt('Введите секунды, в формате 00:'),
				minutes = +prompt('Введите минуты, в формате 00:'),
				hour = +prompt('Введите часы, в формате 00:')
			) {
				if (second === '') {
					second = '00'
				}
				if (minutes === '') {
					minutes = '00'
				} else {
				}
				alert(`Сейчас ${hour};${minutes};${second}`)
			}

            // 8. Написать функцию, которая принимает часы, минуты и секунды и возвращает это время в секундах.
            function eight(
                test,
				second = +prompt('Введите секунды:'),
				minutes = +prompt('Введите минуты:'),
				hour = +prompt('Введите часы:')
			) {
				let hourmin = Math.floor(hour * 3600)
				let minutessec = Math.floor(minutes * 60)
				let result = second + hourmin + minutessec
				alert(`Всего у нас ${result} секунд`)
			}

            // 9. Написать функцию, которая принимает количество секунд, 
            // переводит их в часы, минуты и секунды и возвращает в виде строки «чч:мм:сс».
            function nine (test, a = +prompt('Введите секунды:')) {
                let second = a % 60;
                let b =  Math.floor(a / 60)
                let minute = b % 60
                let hour = Math.floor(b / 60)

            
                alert(`${second} ; ${Math.floor(minute)} ; ${Math.floor(hour)}`)
            }

            // 10. Написать функцию, которая считает разницу между датами. 
            // Функция принимает 6 параметров, которые описывают 2 даты, 
            // и возвращает результат в виде строки «чч:мм:сс». 
            // При выполнении задания используйте функции из предыдущих 2-х заданий: 
            // сначала обе даты переведите в секунды, узнайте разницу в секундах, 
            // а потом разницу переведите обратно в «чч:мм:сс».
            function ten (
                test,
                a = +prompt("Введите секунды первой даты: "),
                b  = +prompt("Введите минуты первой даты: "),
                c  = +prompt("Введите часы первой даты: "),
                d  = +prompt("Введите секунды второй даты: "),
                f = +prompt("Введите минуты второй даты: "),
                j = +prompt("Введите часы второй даты: ")
                ) {
                    let hourminone = Math.floor(c * 3600)
                    let minutessecone = Math.floor(b * 60)
                    let resultone = a + hourminone + minutessecone

                    let hourmintwo = Math.floor(j * 3600)
                    let minutessectwo = Math.floor(f * 60)
                    let resulttwo = d + hourmintwo + minutessectwo

                    let max = Math.max(resultone, resulttwo)
                    let min = Math.min(resultone, resulttwo)
                    let result = max - min

                    let second = result % 60;
                    let g =  Math.floor(result / 60)
                    let minute = g % 60
                    let hour = Math.floor(g / 60)

                    alert(`Разница: ${second} ; ${Math.floor(minute)} ; ${Math.floor(hour)}`)
                    }

                    document.getElementById("myButton-one").addEventListener("click", one);
                    document.getElementById("myButton-two").addEventListener("click", two);
                    document.getElementById("myButton-three").addEventListener("click", three);
                    document.getElementById("myButton-four").addEventListener("click", four);
                    document.getElementById("myButton-five").addEventListener("click", five);
                    document.getElementById("myButton-six").addEventListener("click", six);
                    document.getElementById("myButton-seven").addEventListener("click", seven);
                    document.getElementById("myButton-eight").addEventListener("click", eight);
                    document.getElementById("myButton-nine").addEventListener("click", nine);
                    document.getElementById("myButton-ten").addEventListener("click", ten);
    </script>
