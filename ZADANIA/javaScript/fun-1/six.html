<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<script>
			function six(
				numOne = +prompt('Введите минимальное число диапазона: '),
				numTwo = +prompt('Введите максимальное число диапазона: ')
			) {
				for (i = numOne; i <= numTwo; i++) {
					let number = i
					let oneSty = number / 2

					let result = 0

					for (j = 1; j <= oneSty; j++) {
						if (number % j === 0) {
							result += j
						}
					}
					if (number === result) {
						alert('Вы ввели совершенное число: ' + i)
					}
				}
			}
			console.log(six())
		</script>
	</body>
</html>
