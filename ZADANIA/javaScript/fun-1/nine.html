<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function nine (a = +prompt('Введите секунды:')) {


            let second = a % 60;
            let b =  Math.floor(a / 60)
            let minute = b % 60
            let hour = Math.floor(b / 60)

        
            alert(`${second} ; ${Math.floor(minute)} ; ${Math.floor(hour)}`)
        }
        nine()
    </script>
</body>
</html>
