<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Классы</title>
</head>
<body>
    <script>

        class User {
            constructor(name, age, role="user") {
                this.name = name;
                this.age = age;
                this.role = role;
            }

            describe() {
                return `Имя пользователя: ${this.name}\nВозраст пользователя: ${this.age}\nРоль пользователя: ${this.role}`;
            }
        }

        class Admin extends User {
            constructor(name, age, pass, role="user", func = ["Удаление пользователей"], session="admin") {
                super(name, age, role);
                this.pass = pass;
                this.func = func;
                this.session = session;
            }

            deleteUser(user) {
                return `Пользователь ${user.name} был удалён.`;
            }
        }

        class SuperAdmin extends Admin {
            constructor(name, age, pass, role="user", func = ["Удаление пользователей"], session="admin") {
                super(name, age, role, func, session);
            }


            banUser(user) {
                user.banned = true;
            }
        }

        class Moderator extends User {
            constructor(name, age, categories, pass, role="user", users="all") {
                super(name, age, role);
                this.categories = categories;
                this.pass = pass;
                this.users = users;
            }

            editUser(user, newName) {
                user.name = newName;
                return user;
            }
        }

        let usersArray = [];
        let countUsers = +prompt("Введите количество пользователей: ");
        for(let i = 0; i < countUsers; i++) {
            let questionRole = prompt("Вы желаете добавить Пользователя, Модератора или Админа?\n(Введите: user, moder, admin)");
            if (questionRole === "user") {
                usersArray[i] = new User (
                    prompt("Введите имя Пользователя: "),
                    +prompt("Введите возраст Пользователя: "),
                    prompt("Введите роль Пользователя: ")
                )
            }
            if (questionRole === "moder") {
                usersArray[i] = new Moderator (
                    prompt("Введите имя Модератора: "),
                    +prompt("Введите возраст Модератора: "),
                    prompt("Введите категорию Модератора: "),
                    +prompt("Введите пароль Модератора: "),
                    prompt("Введите роль Модератора: "),
                    prompt("Введите пользователей, имена которых Модератор имеет право изменять: ")
                )
            }
            if(questionRole === "admin") {
                usersArray[i] = new Admin (
                    prompt("Введите имя Админа: "),
                    +prompt("Введите возраст Админа: "),
                    +prompt("Введите пароль Админа: "),
                    prompt("Введите роль Админа: "),
                )
            }
        }
        for(let i = 0; i < countUsers; i++) {
            console.log(usersArray[i].describe());
        }
        console.log("**********************\n********************");
        for(let i = 0; i < countUsers; i++) {
            if (usersArray[i].role === 'moder') {
                for(let j = 0; j < countUsers; j++) {
                    if (usersArray[j].role === 'user') {
                        if (usersArray[j].banned === true) {
                            continue;
                        } else {
                            usersArray[i].editUser(usersArray[j], 'Тест');
                            break;
                        }
                    }
                    j++;
                }
            }
            if (usersArray[i].role === 'admin') {
                for (let j = countUsers-1; j >= 0; j--) {
                    if (usersArray[j].role === 'user') {
                        console.log(usersArray[i].deleteUser(usersArray[j]));
                        break;
                    }
                }
            }
        }
        for(let i = 0; i < countUsers; i++) {
            console.log(usersArray[i].describe());
        }

    </script>
</body>
</html>
