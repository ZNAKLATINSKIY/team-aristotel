<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .container {
            max-width: 1160px;
            margin: 0 auto;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }
        .block {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
        }
        .block-content {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: white;
            width: 500px;
            height: 100px;
            border-radius: 20px;
            transition: 0.2s;
        }
        .block-content:active {
            background-color: #5e5e5e;
        }
        .block-content > span {
            font-size: 50px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .image {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="block">
                <div class="block-content" id="block-content">
                    <img src="1555605-200.png" alt="image" class="image">
                    <span>LIKE</span>
                    <span id="numbers">0</span>
                </div>
            </div>
        </div>
    </main>

</body>
<script>
    const number = document.getElementById('numbers');

    let numbers = 0;

    document.getElementById('block-content').addEventListener('click', function () {
        numbers += 1;
        number.textContent = numbers;
    })
</script>
</html>
