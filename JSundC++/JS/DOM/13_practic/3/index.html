<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <main>
        <div class="container">
            <div class="block">
                <div class="block-content" id="block-content">
                    <img src="1555605-200.png" alt="image" class="image">
                    <span>LIKE</span>
                    <span id="numbers">0</span>
                </div>
            </div>
        </div>
    </main>

</body>
<script>
    const number = document.getElementById('numbers');

    let numbers = 0;

    document.getElementById('block-content').addEventListener('click', function () {
        numbers += 1;
        number.textContent = numbers;
    })



</script>
</html>
