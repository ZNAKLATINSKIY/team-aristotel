<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        #block {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 400px;
            background-color: red;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        * {
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div id="block">
        <span id="x"></span>
        <span id="y"></span>
        <span id="mouse"></span>
    </div>

    <script src="main.js"></script>
</body>
</html>
