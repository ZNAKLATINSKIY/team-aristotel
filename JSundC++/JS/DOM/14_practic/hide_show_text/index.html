<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            padding-top: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .block {
            background: #4CAF50;
            width: 500px;
            height: 300px;
        }
        #button {
            width: 150px;
            height: 50px;
            background: aqua;
            font-size: 25px;
            cursor: pointer;
        }
        #text {
            font-size: 35px;
        }
    </style>
</head>
<body>
    <div class="block">
        <h1>Hide and Show Text</h1>
        <button id="button">Show/Hide</button>
        <p id="text">Текст и информация здесь должны быть.</p>
    </div>

    <script src="main.js"></script>
</body>
</html>
