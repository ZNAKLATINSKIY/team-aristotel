<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        body {
            padding: 400px;
        }
        .number__and__buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            padding: 5px;
            gap: 5px;
        }
        #number {
            border-right: 1px solid black;
            padding-right: 5px;
            font-size: 30px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="number__and__buttons">

        <div id="number">0</div>

        <div class="buttons">
            <button id="button_up">↑</button>
            <button id="button_down">↓</button>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
