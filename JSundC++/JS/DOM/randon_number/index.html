<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
      body {
        padding: 150px;
        display: flex;
        align-items: center;
        flex-direction: column;
      }
      h1 {
        font-size: 40px;
        text-align: center;
      }
      #number {
        font-size: 50px;
      }
      #btn {
        display: block;
        padding: 20px 20px;
        width: 300px;
        font-size: 25px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
</head>
<body>
    <h1>Генератор рандомных чисел</h1>
    <span id="number">1</span>
    <button id="btn">Сгенерировать</button>

    <script src="./main.js"></script>
</body>
</html>
