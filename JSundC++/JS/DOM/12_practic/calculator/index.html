<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body {
            display: flex;
            padding-top: 100px;
            justify-content: center;
            font-size: 25px;
        }
        .calculator {
            width: 400px;
            height: 400px;
            background: white;
            border: 1px solid gray;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #calculator__result {
            margin-top: 20px;
        }
        .calculator__buttons {
            margin-top: 25px;
        }
        .calculator__inputs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .button {
            width: 75px;
            height: 75px;
            font-size: 40px;
            cursor: pointer;
        }
        .calculator__clear {
            margin-top: 25px;
        }
        .button__clear {
            width: 315px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1 class="title">Калькулятор</h1>
        <div class="calculator__inputs">
            <input class="input" id="leftNum" type="text" placeholder="Первое число">
            <span class="char" id="operator"></span>
            <input class="input" id="rightNum" type="text" placeholder="Второе число">
        </div>
        <span id="calculator__result">Результат</span>
        <div class="calculator__buttons">
            <button class="button" id="sum">+</button>
            <button class="button" id="min">-</button>
            <button class="button" id="del">/</button>
            <button class="button" id="mult">*</button>
        </div>
        <div class="calculator__clear">
            <button class="button__clear" id="clear">Очистить</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
