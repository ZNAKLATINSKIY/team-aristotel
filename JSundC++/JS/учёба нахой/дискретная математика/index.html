        // Задача: Напиши функцию isDivisible(n, divisor), которая возвращает true, если n делится на divisor без остатка.
        function isDivisible(n, divisor) {
            return n % divisor === 0;
        }

        // 2. Логические операторы
        // Задача: Напиши функцию isInRange(x, min, max), которая проверяет, что x лежит между min и max (включительно).
        function isInRange(x, min, max) {
            return x >= min && x <= max;
        }

            if (password.length < 8) return false;

            let numbers_list = '123456789';
            let symbols_list = '!@#$%^&*';

            let hasSymbol = false;

                }

                }

                    break;
                }
            }
