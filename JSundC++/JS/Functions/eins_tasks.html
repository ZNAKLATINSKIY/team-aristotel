<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

// Написать функцию, которая принимает 2 числа и возвращает
// -1, если первое меньше, чем второе;
// 1 – если первое больше, чем второе;
// и 0 – если числа равны.
        function compareNumbers(a, b) {
            if (a < b) {
                return -1;
            } else if (a > b) {
                return 1;
            } else {
                return 0;
            }
        }

// Написать функцию, которая вычисляет факториал переданного ей числа.
        function factorial(n) {
            if (n === 0 || n === 1) {
                return 1;
            }
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

// Написать функцию, которая принимает три отдельные цифры и превращает их в одно число. Например: цифры 1, 4, 9 превратятся в число 149.
        function digitsToNumber(a, b, c) {
            return a * 100 + b * 10 + c;
        }

// Написать функцию, которая принимает длину и ширину прямоугольника и вычисляет его площадь.
// Если в функцию передали 1 параметр, то она вычисляет площадь квадрата.
        function calculateArea(length, width) {
            if (width === undefined) {
                return length * length; // Площадь квадрата
            }
            return length * width; // Площадь прямоугольника
        }

// Написать функцию, которая проверяет, является ли переданное ей число совершенным.
// Совершенное число – это число, равное сумме всех своих собственных делителей.
        function isPerfectNumber(num) {
            let sum = 0;
            for (let i = 1; i < num; i++) {
                if (num % i === 0) {
                sum += i;
                }
            }
            return sum === num;
        }


    </script>
</body>
</html>
