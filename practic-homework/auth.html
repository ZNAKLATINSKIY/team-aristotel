<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Аккаунт</title>
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header>
        <div class="container">
            <nav class="header__navbar">
                <div class="navbar__links navbar__blocks">
                    <a href="index.html">Главная</a>
                    <a href="cart.html">Корзина</a>
                </div>
                <a href="index.html" class="navbar__title">KRAKEN</a>
                <div class="navbar__auth navbar__blocks">
                    <a href="auth.html">Вход</a>
                    <a href="auth.html">Регистрация</a>
                </div>
                <span class="navbar__account navbar__blocks">ИМЯ ПОЛЬЗОВАТЕЛСЯ</span>
            </nav>
        </div>
    </header>
    <main>

        <section class="main__registration" id="registration">
            <div class="container">
                <div class="main__content">
                    <h2 class="main__reg-tagline">Регистрация</h2>
                    <div class="main__block auth__block">
                        <form id="registerForm">
                            <label for="name"></label>
                            <input class="column__block-form" type="text" name="name" id="name" placeholder="Name">
                            <label for="email"></label>
                            <input class="column__block-form" type="email" name="email" id="email" placeholder="Email">
                            <label for="password"></label>
                            <input class="column__block-form" type="password" name="password" id="password" placeholder="Password">
                            <button class="main__button auth__button">Зарегистрироваться</button>
                        </form>
                    </div>
                </div>
            </div>  
        </section>

        <section class="main__authorization" id="authorization">
            <div class="container">
                <div class="main__content" id="main__content-auth">
                    <h2 class="main__reg-tagline">Авторизация</h2>
                    <div class="main__block auth__block auth">
                        <form ID="authForm">
                            <label for="email"></label>
                            <input class="column__block-form" type="email" name="email" id="authEmail" placeholder="Email">
                            <label for="password"></label>
                            <input class="column__block-form" type="password" name="password" id="authPassword" placeholder="Password">
                            <button class="main__button auth__button">Авторизоваться</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <section class="in-system" id="in-system">
            <div class="container">
                <div class="main__content" >
                    <h2 class="main__reg-tagline">Вы в аккаунте</h2>
                    <div class="main__block">
                        <span class="main__catalog-tagline">Ваше имя: <span class="main__catalog-tagline" id="auth__name">dqwdqwdqw</span></span>
                        <span class="main__catalog-tagline">Ваш email: <span class="main__catalog-tagline" id="auth__email">dqwdqwdqw</span></span>
                        <span class="main__catalog-tagline">Ваш пароль: <span class="main__catalog-tagline" id="auth__pass">dqwdqwdqw</span></span>
                    </div>
                    <button class="main__button" id="auth__exit">ВЫХОД</button>
                </div>
            </div>
        </section>

    </main>
</body>
<script type="module" src="./js/common.js"></script>
<script type="module" src="./js/auth.js"></script>
</html>
