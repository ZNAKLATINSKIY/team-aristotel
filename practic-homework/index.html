<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav class="header__navbar">
                <div class="navbar__links navbar__blocks">
                    <a href="index.html">Главная</a>
                    <a href="cart.html">Корзина</a>
                </div>
                <a href="index.html" class="navbar__title">KRAKEN</a>
                <div class="navbar__auth navbar__blocks">
                    <a href="auth.html">Вход</a>
                    <a href="auth.html">Регистрация</a>
                </div>
                <a href="auth.html" class="navbar__account navbar__blocks">ИМЯ ПОЛЬЗОВАТЕЛСЯ</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">

            <div class="main__content">
                <div class="main__catalog-tagline">
                    <h2>Наш каталог товаров</h2>
                </div>
                <div class="main__content gray">
                    <div class="main__controls">
                        <input class="input" type="text" id="searchInput" placeholder="Поиск товаров..." />
                        <select class="input" id="categoryFilter">
                            <option value="all">Все категории</option>
                            <option value="men's clothing">Мужская одежда</option>
                            <option value="women's clothing">Женская одежда</option>
                            <option value="jewelery">Украшения</option>
                            <option value="electronics">Электроника</option>
                        </select>
                        <select class="input" id="sortSelect">
                            <option value="">Без сортировки</option>
                            <option value="price-asc">Цена: по возрастанию</option>
                            <option value="price-desc">Цена: по убыванию</option>
                            <option value="title-asc">Название: А–Я</option>
                            <option value="title-desc">Название: Я–А</option>
                        </select>
                    </div>
                    <div class="main__block"></div>
                </div>
            </div>

        </div>
    </main>
</body>
    <script type="module" src="./js/common.js"></script>
    <script type="module" src="./js/catalog.js"></script>
</html>
