<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/navbar_styles.css">
    <link rel="stylesheet" href="./styles/footer_styles.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/login_styles.css">
    <link rel="stylesheet" href="./styles/register_styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <button onclick="go_back()" class="nav__back">
                <img src="./images/arrow.svg" class="nav__arrow" alt="стрелка">
                <span class="nav__back-button">Вернуться</span>
            </button>
        </nav>
    </header>
    <main class="main">
        <section class="log_in">

            <div class="container">
                <h1 class="login__title">РЕГИСТРАЦИЯ</h1>

                <div class="login__content">

                    <form class="login__form register__form">
                        <div class="login__stroke form__stroke">
                            <label for="username" class="form-label">Логин:</label>
                            <input type="text" class="form-input" id="username" placeholder="Введите логин" autocomplete="off">
                        </div>
                        <div class="password__stroke form__stroke">
                            <label for="password" class="form-label">Пароль:</label>
                            <input type="password" class="form-input" id="password" placeholder="Введите пароль" autocomplete="off">
                        </div>
                        <div class="password__stroke-confirmation form__stroke">
                            <label for="password-confirmation" class="form-label">Подтвердите пароль:</label>
                            <input type="password" class="form-input" id="password-confirmation" placeholder="Введите пароль" autocomplete="off">
                        </div>

                        <button id="registerButton" class="form__button">Зарегистрироваться</button>
                    </form>

                </div>

            </div>

        </section>
        <div id="customAlert" class="custom-alert">
            Текст скопирован!
        </div>
    </main>

    <script src="./scripts/login_and_register/go-back.js"></script>
    <script type="module" src="./scripts/login_and_register/password-confirmation.js"></script>
    <script type="module" src="./scripts/login_and_register/account_register.js"></script>
</body>
</html>
