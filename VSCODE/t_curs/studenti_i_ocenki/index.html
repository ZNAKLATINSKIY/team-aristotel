<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Студенты</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      color: #4caf50;
      margin-top: 30px;
    }

    #studentForm {
      margin-bottom: 20px;
    }

    #studentName {
      padding: 10px;
      font-size: 16px;
      width: 200px;
      margin-right: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .student {
      background-color: #ffffff;
      margin: 10px auto;
      padding: 15px;
      width: 750px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      gap: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .student-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .student-actions {
      display: flex;
      gap: 10px;
    }

    .add-grade-btn, .delete-btn {
      padding: 5px 10px;
      font-size: 14px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .add-grade-btn:hover, .delete-btn:hover {
      background-color: #007B8A;
    }

    .student-grades {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .student-form-wrapper {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Студенты</h1>

  <div class="student-form-wrapper">
    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Имя студента" required>
      <button type="submit">Добавить</button>
    </form>
  </div>

  <div id="students"></div>

  <script type="module" src="students.js"></script>
</body>
</html>
